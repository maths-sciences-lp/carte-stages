name: Surveillance nocturne
on:
  schedule:
    - cron: '17 4 * * *'   # chaque nuit vers 6 h 17 (heure de Paris en été)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 source/surveillance.py
